name: Plugin

on:
  pull_request:
    paths:
      - "plugins/remocn/**"
      - "evals/remocn/**"
      - ".claude-plugin/**"
  push:
    branches: [main]
    paths:
      - "plugins/remocn/**"
      - "evals/remocn/**"
      - ".claude-plugin/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict plugins/remocn
      - run: claude plugin validate --strict .
      # The Claude and Agent Plugins manifests must agree on the release.
      - run: |
          test "$(jq -r .version plugins/remocn/plugin.json)" = "$(jq -r .version plugins/remocn/.claude-plugin/plugin.json)"
      # The directory takes scripts only from Verified organizations: keep the plugin to
      # Markdown, JSON, YAML, text and images, with no shebangs.
      - name: Plugin holds only file types the directory accepts
        run: |
          bad=$(git ls-files plugins/remocn | grep -vE '\.(md|txt|json|ya?ml|png|jpe?g|gif|webp|ico)$' || true)
          shebang=$(git ls-files plugins/remocn | while read -r f; do [ "$(head -c 2 "$f")" = '#!' ] && echo "$f"; done || true)
          if [ -n "$bad$shebang" ]; then
            printf '::error::Not allowed in the plugin folder:\n%s\n%s\n' "$bad" "$shebang"
            exit 1
          fi

  evals:
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so plugin evals are skipped."
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      # One run per case, no baseline arm: a regression signal at about $4 a
      # run. Pinned model, so a model rollout isn't read as a plugin change.
      - if: env.ANTHROPIC_API_KEY != ''
        run: >-
          claude plugin eval .
          --trust-plugin --no-publish --scaffold
          --runs 1 --ablation none --model sonnet -j 4
          --max-cost-usd 10
          --allow-tools "WebFetch(domain:remocn.dev)"
